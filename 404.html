  <style>
    @font-face {
      font-family: 'Milchella';
      src: url('fonts/Milchella-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-main: #ffffff;
      --text-dark: #111111;
      --text-muted: #666666;
      --text-light: #999999;
      --border-light: #e5e5e5;
      --accent-line: #000000;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #000000;
        --text-dark: #ffffff;
        --text-muted: #aaaaaa;
        --text-light: #666666;
        --border-light: #1a1a1a;
        --accent-line: #ffffff;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-main); color: var(--text-dark); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; overflow-x: hidden; }
    body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(128,128,128,0.02) 40px, rgba(128,128,128,0.02) 80px); pointer-events: none; z-index: 0; }

    .error-container { max-width: 650px; text-align: center; margin: 0 auto; position: relative; z-index: 1; }
    .pre-line { width: 60px; height: 2px; background: var(--accent-line); margin: 0 auto 30px auto; opacity: 0.5; }
    .error-code { font-family: 'Milchella', 'Syne', serif; font-size: clamp(7rem, 18vw, 14rem); font-weight: 400; line-height: 1; color: var(--text-dark); letter-spacing: -0.03em; margin-bottom: 20px; text-shadow: 4px 4px 0px rgba(128,128,128,0.1); }
    .error-divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px auto; }
    .error-divider-line { width: 50px; height: 1px; background: var(--text-muted); opacity: 0.4; }
    .error-divider-diamond { width: 6px; height: 6px; background: var(--text-muted); transform: rotate(45deg); opacity: 0.6; }
    .error-title { font-family: 'Clash Display', 'Syne', sans-serif; font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 700; color: var(--text-dark); margin-bottom: 16px; letter-spacing: -0.02em; }
    .error-description { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; max-width: 450px; margin-left: auto; margin-right: auto; }

    .error-symbol { margin-bottom: 30px; display: inline-block; animation: float 3s ease-in-out infinite; }
    .error-symbol svg { width: 70px; height: 70px; stroke: var(--text-dark); stroke-width: 1.5; fill: none; opacity: 0.7; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }

    .button-group { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 30px; font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; transition: all 0.3s ease; cursor: pointer; border-radius: 0; }
    .btn-primary { background: var(--text-dark); color: var(--bg-main); border: 2px solid var(--text-dark); }
    .btn-primary:hover { background: transparent; color: var(--text-dark); transform: translateY(-3px); }
    .btn-secondary { background: transparent; color: var(--text-dark); border: 2px solid var(--text-dark); }
    .btn-secondary:hover { background: var(--text-dark); color: var(--bg-main); transform: translateY(-3px); }

    .suggestions { margin-top: 55px; padding-top: 40px; border-top: 1px solid var(--border-light); }
    .suggestions-title { font-family: 'Clash Display', 'Syne', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.2em; margin-bottom: 24px; color: var(--text-muted); text-transform: uppercase; }
    .suggestions-grid { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .suggestion-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-size: 0.8rem; transition: all 0.3s ease; padding: 8px 18px; border-radius: 40px; background: rgba(128,128,128,0.04); border: 1px solid transparent; }
    .suggestion-link:hover { color: var(--text-dark); border-color: var(--border-light); transform: translateY(-2px); }
    .footer-note { margin-top: 60px; font-size: 0.65rem; color: var(--text-light); text-align: center; letter-spacing: 0.5px; }

    @media (max-width: 600px) {
      .button-group { flex-direction: column; align-items: center; gap: 12px; }
      .btn { width: 220px; justify-content: center; padding: 12px 24px; }
      .error-symbol svg { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
